
user root;
worker_processes 4;
worker_rlimit_nofile 10240;

error_log  /dev/null;
#error_log  /var/log/openresty/error.log;
#error_log  logs/error.log  info;
#pid        logs/nginx.pid;

#debug
#master_process off;
#error_log stderr notice;
#daemon off;

events {
	use epoll;
	worker_connections  10240;
}


http {
	resolver 114.114.114.114 223.5.5.5;

	include       mime.types;
	default_type  application/octet-stream;
	access_log  off;
	#access_log /var/log/openresty/access.log;
	#ssl_protocols TLSv1.2 TLSv1.3;
	#ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384';

	sendfile        on;
	#tcp_nopush     on;
	keepalive_timeout  0;
	#gzip  on;
        gzip_static on;

	root   /usr/ikuai/www;
	index  index.html;

	client_body_buffer_size 1024k;
	client_max_body_size 2m;
	client_header_timeout 15s;
	client_body_timeout 15s;
	lua_shared_dict sess_key 512k;
	lua_shared_dict limited_accass 64k;
	lua_shared_dict webauth_popups  512k;
	lua_shared_dict rt_collect 64k;
	init_by_lua_file lua/init.lua;

	include conf/webauth.conf;  #WEB认证
	include conf/server.conf;   #web管理
	include conf/notice.conf;   #推送通知
	include conf/ppp_passwd.conf;  #自助修改密码
	include conf/ac.conf;       #AC下发patch
	include conf/static_file.conf;      #静态文件服务
}
