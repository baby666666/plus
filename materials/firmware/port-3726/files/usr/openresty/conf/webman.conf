# bound management requests separately from firmware/file upload.
client_max_body_size 2m;
client_body_timeout 15s;
proxy_read_timeout 60;
proxy_send_timeout 60;
proxy_connect_timeout 10;
proxy_http_version 1.1;
proxy_cookie_domain off;

location = @ik_rest{
	proxy_method POST;
	proxy_set_header Content-Type "text/json";

	#rewrite_by_lua 'if not ngx.is_subrequest then ngx.exit(400) end' ;
	proxy_pass http://127.0.0.1:34567/router/service;
}

location = @proxy_pass {
        set $proxy_url "$proxy_url";
        proxy_connect_timeout 5s;
        proxy_pass $proxy_url;
}

location /ppp_passwd/set_passwd {
	rewrite_by_lua_file lua/webman/ppp_passwd.lua;
}

location /Action/proxy {
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 5;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
	set $proxy_url "";
	rewrite_by_lua_file lua/webman/index.lua;
	proxy_set_header X-ACTIONPROXY "true";
	proxy_pass $proxy_url;
}

location / {
	rewrite_by_lua_file lua/webman/index.lua;
}

##路由感知websocket页面访问
location /Action/rtcollect/websocket {
	rewrite_by_lua_file lua/webman/index.lua;
}

location = /Action/login {
    client_max_body_size 16k;
    rewrite_by_lua_file lua/webman/index.lua;
}
location = /Action/upload {
    client_max_body_size 128m;
    client_body_timeout 60s;
    rewrite_by_lua_file lua/webman/index.lua;
}
location ^~ /Action/disk/ {
    client_max_body_size 1g;
    client_body_timeout 60s;
    rewrite_by_lua_file lua/webman/index.lua;
}
