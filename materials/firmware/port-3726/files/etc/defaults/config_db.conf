CREATE TABLE reboots(
        id integer primary key,
        enabled         text default 'yes',	---状态
        comment         text default '',	---备注
        event           text default '',	---计划事件
        strategy        text default '',	---计划周期
        cycle_time      text default '',	---计划日期
        time            text default ''		---计划时间
);

CREATE TABLE warning(
        id integer primary key,
        event		text default '',	---事件类型cpu/memory/loop/drop
        interval	integer,		---时间间隔,单位秒
	type		text default '',	---比较方式(big/small)
	value		integer,		---比较值整数1-99
	url		text default ''		---发送通知地址
);

CREATE TABLE cache_service (
	id integer primary key,
	enabled         text    default 'no',   --- yes启用/no停用
	type            text    UNIQUE,         --- 缓存类型，video,data
	port            integer default 650,    --- 监听端口
	max_size        integer default 10,     --- cache占用的最大空间，单位GB
	expired_time    integer default 72,     --- cache过期时间，单位小时,目前未使用
	inactive_time   integer default 10080,  --- 非活跃时间，单位分钟，默认10080分钟(7天)
	cache_min_uses  integer default 1,      --- 缓存文件最少的访问次数，默认1次
	stat_saved_days integer default 31      --- 缓存统计信息保存的天数
);

CREATE TABLE cache_service_iface (
	id integer primary key autoincrement,
	name            text    UNIQUE,         --- 接口名称
	up              integer default 0,      --- 上传带宽,值为非负整数,0表示不限速,单位为KB/s
	down            integer default 0,      --- 下载带宽,值为非负整数,0表示不限速,单位为KB/s
	weight          integer default 1,      --- 权重
	comment         text    default '',     --- 备忘
	enabled         text    default 'no'    --- yes启用/no停用
);

