CREATE TABLE docker_config(
    id      integer primary key,
    name        text unique default '', ---Name
    cpu_usage   integer default 50,     ---cpu usage,1~100
    mem_usage   integer default 50,     ---mem usage，1~100
    image       text default '',        ---镜像文件名称
    networkmode text default 'bridge',  ---bridge, host,container, none
    intf_name   text default 'lan1',    ---接口名称，新创建的专门用于docker的bridge，多个网段
    portmap     text default '',        ---端口映射
    mnt_path    text default '',        ---mount path
    start_cmd   text default '',        ---启动时执行的命令
	cid         text default '',        ---容器id
    auto_start  integer default 0,       ---开机自启
    env_var     text default ''         ---环境变量
);
CREATE TABLE docker_net_config(
	id      integer primary key,
	name    text unique default '', ---网络名称
	subnet  text default ''       ---mount path
);

CREATE TABLE docker_partition_config(
	id      integer primary key,
	partname    text unique default 'unknown'  ---路径
);
CREATE TABLE wakeup(
	id          integer primary key,
	mac         text default '',		---MAC
	strategy    text default 'one',		---策略模式one,week,month
	time        text default '',		---时间
	cycle_time  text default '',		---循环周期日
	enabled     text default '',		---启用/停用yes,no
	comment     text default ''		---备注
);


