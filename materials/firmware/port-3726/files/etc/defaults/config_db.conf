CREATE TABLE qemu_new_config(
	id		integer primary key,
	enabled		text default 'no',	---开启or关闭
	partname	text default '',	---磁盘分区
	name		text unique default '',	---Name
	system		text default 'Linux',	---系统类型
	accel		integer default 1,	---KVM加速模式开启
	brname		text default '',	---Bridge Name, interface1,mac1;interface2,mac2;...
