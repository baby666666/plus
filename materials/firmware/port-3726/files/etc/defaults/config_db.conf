	valid_html_request	text default '',	---html请求
	match_ua		text default '',	---match UA
	excl_ua			text default ''		---excl UA
);

CREATE TABLE  cloud_bak(
	id		integer primary key,
	enabled		text	default 'no',		---yes/no开启状态
	type		integer	default 1,		---备份类型2 auto 1 man
	strategy	text	default 'week',		---备份时间类型 type 
	back_time	text	default '23:59',	---back time
	cyctime		integer	default 5		---自动备份间隔时常  
);

CREATE TABLE  vrrp_config(
	id		integer primary key,
	enabled		text	default 'no',		---yes/no开启状态
	type		integer	default 1,		---1:主模式 2:备份模式 3: 负载模式
	prio		integer	default 150,		---优先级
	method		integer default 2,		---外网探测方式 0: DNS+PING  1: DNS  2: PING
	domain		text	default 'www.baidu.com',	---DNS 默认探测的域名
	dns		text	default '114.114.114.114',	---DNS服务地址
	gateway		text	default 'www.baidu.com',	--- PING 探测的ip地址
	ifnames		text	default '',			--- 外网接口探测列表
	interval	integer	default 3,		--- 探测间隔时间
	auto_sync	integer	default 0,		--- 是否开启配置的自动同步， 默认不开启
	single_line	integer	default 0,		--- 是否开启单线环境
	ignore_wanstatus	integer	default 1,	--- 是否开启外网检测
	interfaces	text	default '',		--- 接口列表
	virtual_ips	text	default '',		--- 对应接口的虚拟ip
	ht_iface	text	default '',		--- 心跳接口
	remote_addr	text	default ''		---对端的ip地址， 心跳线
);

CREATE TABLE dt_mac_qos(
	id integer primary key,
	enabled		text default 'yes',		---状态
	comment		text default '',		---备注
	selectid	text unique default '',		---对象MAC
	upload		integer default 0,		---上传
	download	integer default 0,		---下载
	week		text default 1234567,		---周期
	time		text default '00:00-23:59',	---时间
	attr		integer default 0		---属性,0页面操作,1从内网流量监控中快速添加
);


CREATE TABLE  dev_control(
	id		integer primary key,
	enabled		text	default 'no',		---yes/no开启状态
	name		text	default '',		---设备名称
	type		integer	default 0,		---0: IP地址  1: MAC地址
	ip_addr		text	default '',		---设备IP地址
	mac		text	default '',		---设备MAC地址
	port		text 	default '',		---端口
	protocol	text	default 'tcp',		---协议 tcp/udp
	autonat		integer	default 0,		---是否自动映射
	eport		text 	unique,			---映射的外网端口
	access		text	default '',		---访问方式 默认空, http, https
	method		text	default 'icmp',		---检测方式, icmp, portscan
	device		text	default '',		---设备类型
	shell_port	int	default 0,		---shell 管理端口
	last_time	integer	default 0		---最近离线时间
);

CREATE TABLE  key_manager(
	id		integer primary key,
	enabled		text	default 'no',		---yes/no开启状态
	comment		text	default '',		---备注
	ca		text 	default '',		---证书
	key		text	default ''		---私钥
);

CREATE TABLE  disk_mount(
	id		integer primary key,
	mt_name		text UNIQUE,			---挂载名称
	mt_uuid		text UNIQUE,			---分区UUID
	mt_purpose	integer default 0		---分区用途(0不使用,1普通存储,2有余繁星,3视频缓存,4行为记录,5钉钉闪传)
);

CREATE TABLE  raid_mgmt(
	id		integer primary key,
	name		text UNIQUE,			---阵列名称(rda ~ rdz)
	uuid		text UNIQUE,			---阵列UUID
	number		integer default 0,		---阵列成员数量
	level		integer default 0,		---RAID类型(0==raid0)
	comment		text default ''			---备注
);

CREATE TABLE  webauth_roaming(
	id			integer primary key,
	enabled			text	default 'no',		---yes/no开启状态
	roaming_ip		text	default '',		---服务器ip或域名
	roaming_port		text 	default ''		---服务端口
);

CREATE TABLE ftp_server(
	id			integer primary key,
	enabled			text	default 'no',		---yes/no开启状态
	username		text	unique,			---用户名
	passwd			text 	default '',		---密码
	permission		text 	default 'rw',		---读写权限
	home_dir		text    default '',		---用户目录
	upload			integer default 0,		---上传限速KByte
	download		integer default 0		---下行限速KByte
);

CREATE TABLE http_server(
	id			integer primary key,
	enabled			text	default 'no',		---yes/no开启状态
	http_port		integer default 0,		---端口
	server_name		text	default '',		---ServerName
	ssl_on			integer	default 0,		---开启/关闭ssl加密
	autoindex		integer	default 0,		---目录浏览功能
	download		integer	default 0,		---下载限速
	home_dir		text    default '',		---用户目录
	access			integer	default 1,		---是否允许外网访问http服务 0-不允许 1-允许
	CONSTRAINT http_servername UNIQUE(http_port, server_name)
);

CREATE TABLE switch_dev(
	id          	integer primary key,
	name        	text default '',		---设备名称
	oemname        	text default '',		---设备oemname
	mac         	text default '',		---MAC
	ip_addr    	text unique,			---IP地址
	netmask    	text default '',		---掩码
	version  	text default '',		---固件版本
	device     	text default '',		---设备型号
	connect_time    integer default 0,		---设备上线时间
	type     	text default '',		---设备厂商oidset标识
        snmp_version    text default 'v2c',		---版本名
        community       text default 'public',		---团体名，v1/v2使用
        username        text default '',		---用户名，v3使用
        security        text default '',		---仅认证authNoPriv or 认证且加密 authPriv
        auth_proto      text default '',		---认证模式，MD5|SHA
        auth_pass       text default '',		---认证密码，最少8个字符
        priv_proto      text default '',		---加密模式，DES|AES
        priv_pass       text default ''			---加密密码，最少8个字符
);

--交换机端口下联设备类型及描述保存
CREATE TABLE switch_interface_dev_info(
	id          	integer primary key,
	mac		text,				---IP地址对应的mac，使用mac是为了dhcp获得ip发生变更，配置仍然对应
	portid		text,				---设备厂商oidset标识，因index关键字为数据库关键字，启用名字portid
	if_dev_type	text default '',		---端口下联设备的类型
	if_dev_comment	text default '',		---端口下联设备的描述
	CONSTRAINT mac_portid UNIQUE(mac, portid)	---设置ip和端口做联合唯一约束，程序中replace语句会依赖此约束
);

--客户手动维护交换机link表
CREATE TABLE custom_switch_links(
        id              integer primary key,
        lmac            text default '',        ---local MAC
        rmac            text default '',        ---remote MAC
        lifname         text default '',        ---local interface name
        rifname         text default '',         ---remote interface name
	CONSTRAINT custom_switch_links_uniq UNIQUE(lmac, rmac)	--源mac和目的mac确定两台设备的唯一连接
);

CREATE TABLE igmp_proxy(
	id			integer primary key,
	enabled			text	default 'no',		---yes/no开启状态
	version			text	default '3',		---igmp版本
	downstream		text	default '',		---下行端口
	upstream		text    default ''		---上行端口
);

CREATE TABLE udp_proxy(
	id			integer primary key,
	enabled			text	default 'no',		---yes/no开启状态
	interface		text	default '',		---接口
	renew_time		integer	default 0,		---订阅周期(单位s)
	listen_port		integer	default '',		---服务端口
	access			integer	default 1		---是否允许外网访问 0-不允许 1-允许
);

CREATE TABLE irqbalance(
	id			integer primary key,
	cpuid			text	default '',		---cpuid
	irq			integer default 0,		---0: 软中断  1: 硬中断
	irq_num			text 	default ''		---网卡中断号
);

CREATE TABLE iperf3_server(
	id			integer primary key,
	enabled			text 	default 'no',		---开启或关闭
	port			integer default 5201		---开启或关闭
);

CREATE TABLE cpufreq(
	id			integer primary key,
	turbo			integer	default 1,		---cpu睿频
	mode			text	default 'off'		---cpu调频模式
);

CREATE TABLE sysctl(
	id			integer primary key,
	bbr			integer default 0,
	syn_recv_timeout	integer	default 5,
	syn_send_timeout	integer	default 5,
	established_timeout	integer default 1800,
	fin_wait_timeout	integer default 10,
	last_ack_timeout	integer default 10,
	close_wait_timeout	integer default 10,
	time_wait_timeout	integer default 10,
	close_timeout		integer default 5,
	udp_timeout		integer default 10,
	udp_stream_timeout	integer default 60,
	icmp_timeout		integer default 10
);
CREATE TABLE smbd(
	id                      integer primary key,
	enabled                 text    default 'no',		---开启或关闭
	workgroup		text    default 'WORKGROUP',	---工作组
	wsdd2			integer	default 1,		---启用网络发现
	interface               text    default '',		---接口
	access			integer default 1		---是否允许外网访问 0-不允许 1-允许
);

CREATE TABLE smbd_dir(
	id			integer primary key,
	enabled			text    default 'no',		---开启或关闭
	username		text	unique,
	passwd			text	default '',
	name			text    unique,			---共享名
	perm			text	default 'rw',		---用户权限 rw/ro
	guest			text    default 'yes',		---访客是否可以访问
	browseable		text	default '',		---是否可浏览
	home_dir		text    default ''		---共享目录
);

CREATE TABLE wireguard(
	id			integer primary key,
	enabled			text    default 'no',		---开启或关闭
	name			text	unique,			---wg接口名
	interface		text	default 'auto',		---线路选择
	local_privatekey	text	default '',		---本地私钥
	local_publickey		text	default '',		---本地公钥
	local_address		text	unique,			---本地地址
	local_listenport	integer	default 5000,		---监听端口
	peer_publickey		text    default '',		---对端公钥
	presharedkey		text	default '',		---预共享密钥
	allowips		text	default '',		---允许访问的ip地址
	endpoint		text	default '',		---对端节点IP地址
	endpoint_port		integer,			---端口地址
	mtu			integer default 1420,		---mtu
	keepalive		integer	default 10		---心跳间隔
);

CREATE TABLE wireguard_peers(
	id			integer primary key,
	enabled			text    default 'no',		---开启或关闭
	comment			text	default '',		---备注
	interface		text	default '',		---线路选择
	peer_publickey		text    default '',		---对端公钥
	presharedkey		text	default '',		---预共享密钥
	allowips		text	default '',		---允许访问的ip地址
	endpoint		text	default '',		---对端节点IP地址
	endpoint_port		integer,			---端口地址
	keepalive		integer	default 10,		---心跳间隔
	out_mode text default 'auto',
	out_wans text default '',
	out_balance text default 'failover',
	peer_privatekey text default '',
	client_dns text default '',
	client_endpoint text default '',
	exit_peer text default 'no',
	site_local text default '',
	site_remote text default '',
	native_role text default ''
);

CREATE TABLE syslog_server(
        id                      integer primary key,
        enabled                 text default 'no',              ---发送开关 yes-开 no-关
        host                    text default '',                --host自定义内容
        server                  text default '',                ---服务器ip
        port                    integer default 0,              ---服务器端口
        protocol                text default 'udp',             ---服务器协议
        send_flag               integer default 0,              ---发送开关
        open_all                integer default 0,              ---日志开关1-全部发送
        open_url                integer default 0,              ---网页浏览记录开关 1-开
        open_im                 integer default 0,              ---im开关 1-开
        open_nat                integer default 0,              ---nat开关 1-开
        open_iktimerd_ac        integer default 0,              ---无线终端日志开关 1-开
        open_pppauth            integer default 0,              ---认证日志开关 1-开
        open_offline            integer default 0,              ---终端上下线日志开关 1-开
        open_dhcp               integer default 0,              ---dhcp日志开关 1-开
        open_arp                integer default 0,              ---arp日志开关 1-开
        open_pppd               integer default 0,              ---外网拨号日志开关 1-开
        open_ddns               integer default 0,              ---动态域名日志开关 1-开
        open_opt                integer default 0,              ---操作日志开关 1-开
        open_sys                integer default 0,              ---系统日志开关 1-开
        open_dns                integer default 0,              ---DNS日志开关 1-开
        expired                 integer default 0,              ---到期日期
        delimiter               integer default 10              ---tcp传输行尾分隔符 ascii值
);

CREATE TABLE wuying(
        id                      integer primary key, 
        enabled                 text    default 'yes',
        timestamp               integer default 0,              ---时间戳 
        api_token               text    default '',             ---开启或关闭 
        node                    integer default 0,              ---节点服务器
        comment                 text    default '',             ---备注
        veth_mac                text    default '',
        wan_addr                text    default '10.30.20.0/24',
        lan_addr                text    default '10.31.20.0/24',
        bind_wan_addr           text    default '10.32.20.0/24',
        bind_lan_addr           text    default '10.33.20.0/24',
        interface               text    default ''              ---线路选择 
);

CREATE TRIGGER trigger_mac_comment
BEFORE INSERT ON mac_comment
BEGIN
delete from mac_comment where mac=new.mac;
END;

CREATE TRIGGER trigger_level_sw 
BEFORE INSERT ON level_sw
BEGIN                    
delete from level_sw where aid=new.aid;
END; 

