PRAGMA foreign_keys=OFF;
BEGIN TRANSACTION;

CREATE TABLE version(ver integer, sysver integer);
CREATE TABLE global_config(
	id integer primary key,
	auto_upgrade_lib_dpi	integer default 1,	---升级备份-自动更新DPI特征库
	auto_upgrade_lib_im	integer default 1,	---升级备份-自动更新IM特征库
	auto_upgrade_lib_domain	integer default 1,	---升级备份-自动更新网址库
	auto_upgrade_sec	integer default 1,	---升级备份-自动更新安全策略
	syn_proxy		integer default 0,	---网络设置-分流设置-协议分流(0表示关闭SYN流量代理)
	acl_mac			integer default 0,	---行为管理-Mac访问控制(0黑1白名单控制)
	dhcp_acl_mac		integer default 0,	---DHCP黑名单-Mac访问控制(0黑1白名单2同步mac访问控制的黑白名单)
	dhcp6_acl_mac		integer default 0,	---DHCP6黑名单-Mac访问控制(0黑1白名单)
	url_white_refer		integer	default 0,	---行为管理-网址黑白名单的选项,让白名单支持refer匹配
	arp_filter      	integer default 0,      ---未绑定MAC不允许上网
	arp_filter_iface      	text default 'any',     ---指定接口列表
	arp_scan        	integer default 0,      ---自动扫描绑定ARP
	snmp_interval        	integer default 0,      ---snmp获取间隔
	dhcpd_arp        	integer default 0,      ---兼容ARP绑定列表为静态分配
	watchdog        	integer default 1,      ---看门狗开关
	watchdog_thresh         integer default 30,     ---看门狗无响应超时
	open_url_record		integer default 0,	---开启URL记录
	open_im_record		integer default 0,	---开启IM记录
	open_terminal_record	integer default 0,	---开启终端记录
	open_appid_record	integer default 0,	---开启应用详情统计
	reset_total_load	integer default 0,	---开启终端上下行总流量定时清空
	ac_server		integer default 0,	---AC开关
	js_inform3		integer default 0,	---JS3插入开关
	stream_ctl_mode		integer default 0,	---流控开关模式(0关闭,1智能流控,2手工流控)
	ignore_passwd_warn	integer default 0,	---忽略弱密码警告(0默认, 1不再提醒)
	ignore_upgrade_ver	text default '',	---忽略版本升级提示(忽略的版本号等于当前的最新版本号,则不再提醒)
	ignore_dtalk_bind	integer default 0,	---忽略钉钉绑定提示
	parental_mode		integer default 0,	---应用协议控制: 0:默认  1:家长管控模式
	warning_notify		integer default 1	---系统日志:告警信息开关
);

CREATE TABLE alg_config (
	id integer primary key,
	support_ftp	integer default 1,	--ALG FTP  support
	support_tftp	integer default 1,	--ALG TFTP support
	support_sip	integer default 1,	--ALG SIP  support
	support_h323	integer default 1,	--ALG H323 support
	ftp_ports	text default "",	---ftp ports
	sip_ports	text default "",	---sip ports
	tftp_ports	text default ""		---tftp ports
);

CREATE TABLE iptv_config(
	id integer primary key,
	enabled         text default 'no',	---状态
	mode		integer default 0,	---透传模式(0网口透传,1vlan透传)
	wan_iface	text default '',	---外部接口
	wan_vlanid	integer default 0,	---VLAN_ID
	lan_iface	text default '',	---内部接口
	lan_vlanid	integer default 0	---VLAN_ID
);

CREATE TABLE rs485_config(
    id integer primary key, 
    enabled         text default 'no',  ---状态
    conmode        integer default 0,   ---通信模式(0：服务端，1：客户端)
    ip_addr   text default '192.168.9.1',          ---IP 
    netmask   text default '255.255.255.0',          ---子网掩码
    debug_state  integer default 0,  ---调试模式(0：关闭，1：开启)
    debugmode   text default '',     ---调试对话输入输出 
    request  integer default 0,       ---请求状态(0: 没有请求  1:请求数据)
    input_cmd   text default 'ik_debug_req',     ---执行调试命令( 不为空; 默认为： ”ik_debug_req“ ) 
    response   text default '',      ---请求结果 
    port   text default '50000',          ---端口 
    protocol   integer default 0,    ---通信协议(0：UDP，1：TCP(默认 TCP)) 
    baudrate   text default '9600',      ---波特率 
    hwflow   text default '0',        ---硬件流控 
    crc   integer default 0,         ---校验 
    stopbit  integer default 1       ---停止位
);

CREATE TABLE ipv6_config(
	id integer primary key,
	enabled		text default 'no',
	iface_wan	text default 'wan1'
);

CREATE TABLE ipv6_wan_config(
	id integer primary key,
	enabled			text default 'no',
	interface		text unique,
	internet		text default 'dhcp',
	prefix			text default 'auto',
	prefix_hint		text default '',
	force_prefix            integer default 0,
	force_gen_duid          integer default 1,
	link_addr		text default '',
	ipv6_addr		text default '',
	ipv6_gateway		text default ''
);

CREATE TABLE ipv6_lan_config(
	id integer primary key,
	enabled			text default 'yes',
	interface		text unique default 'lan1',
	parent			text default '',	---继承接口
	internet		text default 'dhcp',	---dhcp/static
	dhcpv6			integer default 1,	---默认开启dhcpv6服务
	ipv6_addr		text unique,
	use_dns6		integer default 0,	---是否下发dns配置
	ipv6_dns1		text default '',	---dns
	ipv6_dns2		text default '',	---dns
	prefix_len		text default 'auto',	---前缀分配长度
	ra_flags		text default '1',	---0: 无状态 1: 无状态+有状态  2: 有状态
	ra_static		integer default 0,	---0: 关闭  1: 开启  开启后,只有静态列表中的终端才会进行无状态分配
	ra_mtu_set		integer default 0,	---ra mtu开关
	ra_mtu			integer default 1480,	---ra mtu
	leasetime		text default '120'	---租期 分钟
);

CREATE TABLE ipv6_dhcp_static_config(
	id integer primary key,
	enabled			text default 'yes',
	link_addr		text default '',	---终端本地链接地址
	src_iface		text default 'lan1',	---dhcp6服务接口
	dst_iface		text default '',	---出接口
	ipv6_addr		text default '',	---lan IPv6地址
	ipv6_addr_len		text default '',	---lan IPv6地址掩码
	comment			text default '',
	CONSTRAINT link_iface UNIQUE(src_iface, link_addr)
);

CREATE TABLE dtalk_ssid(
	id integer primary key,
	enabled1		text default 'yes',
	enabled2		text default 'no',
	ssid1			text default 'DingTalk_001',
	ssid2			text default 'DingTalk_002',
	guest1			integer default 0,
	guest2			integer default 1,
	encryption1		integer default 1,
	encryption2		integer default 1
);

CREATE TABLE basic(
	id integer primary key,
	hostname		text default 'iKuai',	---主机名
	language		integer default 1,	---选择语言
	time_zone		integer default 8,	---国际时区(8=UTC-8)
	time_zone_full		text default '0800',	---国际时区(8=UTC-0800)
	switch_nat		integer default 1,	---上网模式(0NONAT/1对称NAT/2全锥形NAT)
	switch_dpi		integer default 1,	---DPI开关
	switch_ntp		integer default 1,	---自动更新时间
	switch_ntpd		integer default 0,	---ntpd服务开关
	switch_ntpserver	integer default 0,	---ntpd服务开关
	ntpserver_list		text default '',	---自定义ntp服务器
	ntp_sync_cycle		integer default 60,	---同步间隔
	link_mode		integer default 0,	---链路模式(0主干模式,1旁路模式, 2 sdwan桥)
	fast_nat		integer default 0,	---快速转发(0关闭,1开启)
	lan_nat			integer default 1,	---NONAT模式时,wan1地址NAT为lan1地址
	listenport		text default 'lan1',    ---listen port
	backport		text default 'wan1'    --- back port
);

CREATE TABLE register(
	id integer primary key,
	node	integer default 0,	---绑定服务器节点(0中国,1中国香港)
	code	text default '',	---绑定码
	comment	text default ''		---备注
);

CREATE TABLE urlsec(
	id		integer primary key,
	cloud_security	integer default 0,	---云安全
	dangerous	integer default 0	---禁止危险访问
);

CREATE TABLE urlsec_white(
	id integer primary key,
	name		text,		---名称
	domain		text		---域名
);

CREATE TABLE remote_control(
	id integer primary key,
	open_telnetd		integer default 0,	---开启telnetd
	open_wanweb		integer default 0,	---外网访问web管理 0-不允许访问,1-都允许,2-允许ipv4,3-允许ipv6
	open_sshd		integer default 0,	---开启SSHD
	open_ftp		integer default 0,	---ftp服务开关
	ftp_port		integer default 21,	---ftp服务端口
	sshd_port		integer default 22,	---SSHD端口
	sshd_passwd		text default 'www.ikuai8.com',   ---SSHD密码
	http_port		integer default 80,	---HTTP管理端口(0表示关闭HTTP)
	https_port		integer default 443,	---HTTPS管理端口(0表示关闭HTTPS)
	force_https		integer	default 0,	---强制使用HTTPS访问(访问HTTP时强制跳转HTTPS)
	ftp_access		integer	default 1	---是否允许外网访问ftp 0-不允许 1-允许
);

CREATE TABLE webuser(
	id integer primary key,
	comment		text default '',		---备注
	enabled		text default 'yes',		---yes启用/no停用
	username	text unique,			---用户
	passwd		text default '',		---密码
	force		integer default 0,		---密码过期强制修改开关
	interval	integer default 30,		---每间隔多少时间需要修改密码,单位天
	passwd_timeout	integer default 0,		---密码过期时间戳
	sesstimeout	integer default 120,		---会话过期
	group_id	integer				---组ID(对应表名usergroup 的id)
);

CREATE TABLE usergroup(
	id integer primary key,
	group_name	text unique,			---组名称
	perm_config	text default '',		---权限配置(lan:rx,vlan:r,wan:)
	ip_addr		text default '0.0.0.0/0',	---安全IP地址(0.0.0.0/0,192.168.1.1/255.255.255.0,192.168.1.1-192.168.1.200)
	perm_default	text default ''			---默认权限(系统升级以后,赋予功能默认的权限)
);

CREATE TABLE funcore(
	id integer primary key,
	config		text default ''		---配置(lan:0,vlan:1)0是隐藏,1是显示,如果没有设置的话默认是显示的
);

CREATE TABLE lan_config(
	id integer primary key,
	comment		text default '',	---备注
	name		text default '',	---网卡名称
	bandif		text default '',	---绑定网卡mac列表
	bandeth		text default '',	---绑定网卡名称列表
	bandflag	text default '',	---绑定模式列表 bandmode=1时有效
	bandmode	integer default 0,	---绑定模式(0网桥,1汇聚)
	mac		text default '',	---克隆MAC
	speed		integer default 0,	---网卡速率(0自动,10/100/1000/10000)
	duplex		integer default 0,	---工作模式(0自动,1全双/2半双)
	lan_visit	integer default 1,	---允许其他LAN访问
	linkmode	integer default 4,	---4: LACP链路聚合模式  2: 手工链路聚合模式
	policy		integer default 0,	---汇聚负载方式 0: layer2 1:layer3+4 2:layer2+3
	ip_mask		text default ''		---IP地址/掩码(ip1/mask,ip2/mask,...)
);

CREATE TABLE wifi(
	id integer primary key,
	mesh_server		integer default 0,	---启用Mesh服务
	mesh_band		integer default 1,	---0=2g,1=5g
	mesh_bssid		text default '',	---允许关联的BSSID
	mlo_radio0		integer default 0,	---mld radio0
	mlo_radio1		integer default 0,	---mld radio1
	mlo_radio2		integer default 0,	---mld radio2
	dtalk_support		integer default 1,	---支持钉钉认证
	dtalk_support_5g	integer default 1,	---支持钉钉认证
	dtalk_support_d5g	integer default 1,	---支持钉钉认证
	wecom_support		integer default 1,	---支持企业微信认证
	wecom_support_5g	integer default 1,	---支持企业微信认证
	wecom_support_d5g	integer default 1,	---支持企业微信认证
	open2g		text default 'no',	---2G总开关
	open5g		text default 'no',	---5G总开关
	ssid1		text default '',	---SSID(特殊符号需要URLCODE转义,如空格转义成%20)
	ssid2		text default '',	---SSID
	ssid3		text default '',	---SSID
	ssid4		text default '',	---SSID
	bssid1		text default '',	---BSSID
	bssid2		text default '',	---BSSID
	bssid3		text default '',	---BSSID
	bssid4		text default '',	---BSSID
	enc1		text default 'off',	---加密方式(off/wep/wpa/wpa2/wpa+wpa2)
	enc2		text default 'off',	---加密方式
	enc3		text default 'off',	---加密方式
	enc4		text default 'off',	---加密方式
	key1		text default '',	---密码(8~63字符长度)
	key2		text default '',	---密码(8~63字符长度)
	key3		text default '',	---密码(8~63字符长度)
	key4		text default '',	---密码(8~63字符长度)
	brname1		text default 'lan1',	---桥接网卡名称
	brname2		text default 'lan1',	---桥接网卡名称
	brname3		text default 'lan1',	---桥接网卡名称
	brname4		text default 'lan1',	---桥接网卡名称
	hide_ssid1	integer default 0,	---隐藏SSID(0是显示,1是隐藏)
	hide_ssid2	integer default 0,	---隐藏SSID
	hide_ssid3	integer default 0,	---隐藏SSID
	hide_ssid4	integer default 0,	---隐藏SSID
	isolate1	integer default 0,	---访客模式/客户端隔离
	isolate2	integer default 0,	---访客模式/客户端隔离
	isolate3	integer default 0,	---访客模式/客户端隔离
	isolate4	integer default 0,	---访客模式/客户端隔离
	ssid1_5g	text default '',	---SSID
	ssid2_5g	text default '',	---SSID
	ssid3_5g	text default '',	---SSID
	ssid4_5g	text default '',	---SSID
	bssid1_5g	text default '',	---BSSID
	bssid2_5g	text default '',	---BSSID
	bssid3_5g	text default '',	---BSSID
	bssid4_5g	text default '',	---BSSID
	enc1_5g		text default 'off',	---加密方式(off/wep/wpa/wpa2/wpa+wpa2)
	enc2_5g		text default 'off',	---加密方式
	enc3_5g		text default 'off',	---加密方式
	enc4_5g		text default 'off',	---加密方式
	key1_5g		text default '',	---密码(8~63字符长度)
	key2_5g		text default '',	---密码(8~63字符长度)
	key3_5g		text default '',	---密码(8~63字符长度)
	key4_5g		text default '',	---密码(8~63字符长度)
	brname1_5g	text default 'lan1',	---桥接网卡名称
	brname2_5g	text default 'lan1',	---桥接网卡名称
	brname3_5g	text default 'lan1',	---桥接网卡名称
	brname4_5g	text default 'lan1',	---桥接网卡名称
	hide_ssid1_5g	integer default 0,	---隐藏SSID(0是显示,1是隐藏)
	hide_ssid2_5g	integer default 0,	---隐藏SSID
	hide_ssid3_5g	integer default 0,	---隐藏SSID
	hide_ssid4_5g	integer default 0,	---隐藏SSID
	isolate1_5g	integer default 0,	---访客模式/客户端隔离
	isolate2_5g	integer default 0,	---访客模式/客户端隔离
	isolate3_5g	integer default 0,	---访客模式/客户端隔离
	isolate4_5g	integer default 0,	---访客模式/客户端隔离
	channel		integer default 0,	---信道(0自动)
	channel_5g	integer default 0,	---信道(0自动)
	load_strategyg	integer default 1,	---负载策略(0关闭,1拒绝接入,2隐藏SSID)
	autohide_maxsta	integer default 1,	---负载策略阀值1
	autohide_resume	integer default 0,	---负载策略阀值2
	max_pc		integer	default 0,	---最大带机量(0不限制)
	load_strategy_5g	integer default 1,	---负载策略(0关闭,1拒绝接入,2隐藏SSID)
	autohide_maxsta_5g	integer default 1,	---负载策略阀值1
	autohide_resume_5g	integer default 0,	---负载策略阀值2
	max_pc_5g	integer default 0,	---最大带机量(0不限制)
	min_signal	integer default 0,	---最低连接信号(0~100)
	min_signal_5g	integer default 0,	---最低连接信号(0~100)
	hwmode		integer default 0,	---工作模式(0是自动,3是11n,4是11bg,5是11ng,6是11axg,7是11beg)
	hwmode_5g	integer default 0,	---工作模式(0是自动,3是11n,4是11na,5是11ac,6是11axa,7是11bea)
	htbw		integer default 0,	---频段带宽(0是20M,1是40M)
	htbw_5g		integer default 0,	---频段带宽(0是40M,1是80M,2是160M)
	txpower		integer default 0,	---信号功率强度(0强,1中,2弱)
	txpower_5g	integer default 0,	---信号功率强度(0强,1中,2弱)
	perfer_5g	integer default 1,	---5G 优先
	ssid_union	integer default 0,	---SSID名称合并
	ap_roaming	integer default 1,	---漫游阈值
	task_switch1	integer default 0,		---开启时间计划任务
	task_strategy1	text default 'week',		---任务策略类型(one/month/week)一次/每月/每周
	task_date1	text default '1234567',		---周期
	task_time1	text default '00:00-23:59',	---时间
	task_switch2	integer default 0,		---开启时间计划任务
	task_strategy2	text default 'week',		---任务策略类型(one/month/week)一次/每月/每周
	task_date2	text default '1234567',		---周期
	task_time2	text default '00:00-23:59',	---时间
	task_switch3	integer default 0,		---开启时间计划任务
	task_strategy3	text default 'week',		---任务策略类型(one/month/week)一次/每月/每周
	task_date3	text default '1234567',		---周期
	task_time3	text default '00:00-23:59'	---时间
);

CREATE TABLE wan_config (
	id integer primary key,
	modified_time		integer default 0,		---修改配置的时间(时间戳)
	comment			text default '',		---备注
	name			text default '',		---名称
	bandif			text default '',		---绑定网卡设备mac列表
	bandeth			text default '',		---绑定网卡设备名称列表
	bandmode		integer default 0,		---绑定模式(0网桥,1汇聚)
	internet		integer default 1,		---接入模式(0静态IP/1DHCP/2PPPOE/3虚拟接口(交换模式)/4虚拟接口(VLAN模式))
	mac			text default '',		---克隆MAC
	speed			integer default 0,		---网卡速率(0自动,10/100/1000/10000)
	duplex			integer default 0,		---工作模式(0自动,1全双/2半双)
	upload			integer default 0,		---上传
	download		integer default 0,		---下载
	qos_upload		integer default 0,		---流控上传
	qos_download		integer default 0,		---流控下载
	vendorclass		text default '',		---Vendor identifier option60
	clientid		text default '',		---dhcp client id option61
	hostname		text default '',		---dhcp hostname option12
	opt_type12		integer default 0,   		---option type 0: 16进制 1: 字符串
	opt_type60		integer default 0,   		---option type 0: 16进制 1: 字符串
	opt_type61		integer default 0,   		---option type
	---WIFI
	wifi_wisp		integer default 0,		--0关闭,1=2g,2=5g,3=2g+5g
	wifi_bssid		text default '',		---BSSID
	wifi_ssid		text default '',		---SSID名称
	wifi_psk		text default '',		---WIFI密码
	---STATIC
	ip_mask			text default '',		---IP地址/掩码(ip1/mask,ip2/mask,...)
	gateway			text default '',		---网关
	---PPPOE
	username		text default '',		---用户名
	passwd			text default '',		---密码	
	timing_rst_switch	integer default 0,		---定时重拨开关
	timing_rst_week		text default '1234567',		---星期
	timing_rst_time		text default '12:00',		---定时时间
	cycle_rst_time		integer default 0,		---周期时间(分钟),0表示无限
	pppoe_service		text default '',		---PPPOE拨号服务名称
	pppoe_ac		text default '',		---PPPOE拨号ac_name
	mtu			integer default 1480,		---mtu值
	mru			integer default 1480,		---mru值
	--高级选项
	default_route		integer default 0,		---默认路由网关
	disc_auto_switch	integer default 1,		---掉线自动切换
	link_time		text default '00:00-23:59',	---上线时间
